name: Build DeskPilot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FreeRDP source
        uses: actions/checkout@v4
        with:
          repository: FreeRDP/FreeRDP
          ref: master
          path: FreeRDP
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build DeskPilot
        run: |
          chmod +x FreeRDP/client/Android/Studio/gradlew
          # Use the upstream wrapper and its compatible plugin/dependency setup.
          # DeskPilot is included as an additional app module via root settings.
          ./FreeRDP/client/Android/Studio/gradlew --no-daemon -p . :app:assembleDebug

      - name: Upload DeskPilot APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskPilot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
